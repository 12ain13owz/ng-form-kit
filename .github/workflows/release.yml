name: Release

# Push a tag v<version> matching projects/ng-form-kit/package.json to publish to npmjs.com.
# Publishing uses npm trusted publishing (OIDC from this workflow): no npm token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing) and sign provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the package version
        id: version
        run: |
          version=$(node -p "require('./projects/ng-form-kit/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "@workformeow-dev/ng-form-kit@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@workformeow-dev/ng-form-kit@${{ steps.version.outputs.version }} is already on npm; nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm run build
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public
        working-directory: dist/ng-form-kit
